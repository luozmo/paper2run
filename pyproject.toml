[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper2run"
version = "0.1.0"
description = "Evidence-backed paper-to-code and reproduction information assistant"
requires-python = ">=3.10"
dependencies = [
    "deepseek-harness-sdk>=0.2.1rc2,<0.3",
    "pydantic>=2.12,<3",
    "PyMuPDF>=1.24",
    "httpx>=0.27",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.hatch.build.targets.wheel]
packages = ["app"]
